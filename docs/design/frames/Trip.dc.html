<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan trip: preview tomorrow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9ec5ff}a:hover{color:#cfe2ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0e1726; font-family: Inter, system-ui, sans-serif; color: #f1f5f9">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
<g stroke="#1e2b40" stroke-width="10" fill="none"><path d="M-20 120 L420 300"></path><path d="M-20 420 L420 520"></path><path d="M60 -20 L210 880"></path><path d="M300 -20 L250 880"></path></g>
<path d="M70 610 L120 540" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" fill="none"></path>
<path d="M120 540 C160 470 210 420 250 330" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none"></path>
<path d="M250 330 L300 270" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" fill="none"></path>
<circle cx="70" cy="610" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="3"></circle>
<circle cx="300" cy="270" r="10" fill="#f8fafc" stroke="#0e1726" stroke-width="3"></circle>
<circle cx="{{dotX}}" cy="{{dotY}}" r="8" fill="#ffffff" stroke="#f59e0b" stroke-width="4"></circle>
</svg>
<div style="position: absolute; left: 196px; top: 380px; padding: 4px 8px; border-radius: 8px; background: rgba(245,158,11,0.9); color: #1c1300; font: 700 12px Inter, system-ui, sans-serif">Planned work</div>
<div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="flex: 1; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; border-radius: 18px; background: rgba(15,23,42,0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(148,163,184,0.18)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Tomorrow · 9:00 AM</span><span style="font-size: 13px; color: #cbd5e1">Home → [DESTINATION] · about 34 min</span></span>
</div>
<a href="HomeDaily.dc.html" aria-label="Close trip" style="text-decoration: none; box-sizing: border-box; cursor: pointer; width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid rgba(148,163,184,0.18); background: rgba(15,23,42,0.55); color: #f1f5f9; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(15,23,42,0.55); border: 1px solid rgba(148,163,184,0.18); font-size: 13px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 16.6A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.3M8 19v2M12 17v4M16 19v2"></path></svg>Rain · take an umbrella</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: rgba(31,23,8,0.6); border: 1px solid rgba(245,158,11,0.4); font-size: 13px; font-weight: 500; color: #fde68a"><span style="width: 8px; height: 8px; border-radius: 4px; background: #f59e0b"></span>F skips 2 stops</span>
</div>
</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 96px; border-radius: 22px; background: rgba(11,18,32,0.5); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(148,163,184,0.16); padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; border: none; background: #2563eb; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0">
<sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></sc-if>
</button>
<div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: rgba(15,23,42,0.5)">
<sc-for list="{{speeds}}" as="sp" hint-placeholder-count="4">
<button type="button" onClick="{{sp.pick}}" aria-pressed="{{sp.pressed}}" style="height: 40px; border-radius: 10px; border: none; background: {{sp.bg}}; color: {{sp.fg}}; font: 600 14px Inter, system-ui, sans-serif">{{sp.label}}</button>
</sc-for>
</div>
</div>
<div style="height: 6px; border-radius: 3px; background: rgba(148,163,184,0.25); overflow: hidden"><div style="height: 6px; width: {{progress}}; border-radius: 3px; background: #f59e0b"></div></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="Train.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; cursor: pointer; height: 44px; border-radius: 22px; border: none; background: rgba(37,99,235,0.9); color: #ffffff; font: 600 14px Inter, system-ui, sans-serif">Use this route</a>
<button type="button" style="height: 44px; border-radius: 22px; border: 1px solid rgba(148,163,184,0.3); background: transparent; color: #f1f5f9; font: 600 14px Inter, system-ui, sans-serif">Other options</button>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 24px">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 30px; background: #f8fafc; box-shadow: 0 8px 24px rgba(0,0,0,0.45)">
<label for="ask6" style="position: absolute; left: -9999px">Ask the map</label>
<input id="ask6" type="text" placeholder="Change the time or stops…" style="flex: 1; min-width: 0; height: 44px; padding-left: 12px; border: none; background: transparent; font: 400 16px Inter, system-ui, sans-serif; color: #0f172a; outline: none">
<button type="button" aria-label="Dictate" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: transparent; color: #475569; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button type="button" aria-label="Hands-free conversation" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; border: none; background: #2563eb; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg></button>
</div>
</div>
<button type="button" aria-label="Center on my location" style="position: absolute; right: 16px; top: 132px; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #263449; background: rgba(15,23,42,0.92); color: #60a5fa; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.5 2.9L13.4 21 21 3Z"></path></svg></button></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { speed: '10×', playing: false }; }
  renderVals() {
    const labels = ['2×', '5×', '10×', '30×'];
    const speeds = labels.map((l) => ({
      label: l, pressed: l === this.state.speed ? 'true' : 'false',
      bg: l === this.state.speed ? '#f8fafc' : 'transparent',
      fg: l === this.state.speed ? '#0f172a' : '#e2e8f0',
      pick: () => this.setState({ speed: l })
    }));
    const playing = this.state.playing;
    return {
      speeds, playing, paused: !playing,
      playLabel: playing ? 'Pause preview' : 'Play preview',
      toggle: () => this.setState({ playing: !this.state.playing }),
      progress: playing ? '46%' : '0%',
      dotX: playing ? 190 : 120, dotY: playing ? 440 : 540
    };
  }
}
</script>
</body>
</html>
