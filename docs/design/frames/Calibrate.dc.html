<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calibrate: aim at a landmark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9ec5ff}a:hover{color:#cfe2ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1b2433; font-family: Inter, system-ui, sans-serif; color: #f1f5f9">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
<rect x="0" y="0" width="390" height="844" fill="#2a3446"></rect>
<rect x="0" y="0" width="390" height="300" fill="#3b4a63"></rect>
<rect x="-10" y="170" width="120" height="520" fill="#1f2937"></rect>
<rect x="290" y="140" width="120" height="560" fill="#1c2431"></rect>
<rect x="110" y="250" width="180" height="300" fill="#4b3a2c"></rect>
<rect x="128" y="300" width="144" height="38" rx="4" fill="#b91c1c"></rect>
<rect x="140" y="370" width="50" height="120" fill="#2b2118"></rect>
<rect x="210" y="370" width="50" height="120" fill="#2b2118"></rect>
<path d="M0 690 L390 650 L390 844 L0 844 Z" fill="#111827"></path>
<path d="M60 844 L170 690 M330 844 L230 690" stroke="#e5e7eb" stroke-width="4" stroke-dasharray="18 14"></path>
</svg>
<div style="position: absolute; left: 150px; top: 310px; font: 800 14px Inter, system-ui, sans-serif; letter-spacing: 0.12em; color: #fde68a">[STORE]</div>
<div style="position: absolute; inset: 0; background: rgba(8,12,20,0.25); pointer-events: none"></div>
<div style="position: absolute; left: 115px; top: 239px; width: 160px; height: 160px; border-radius: 24px; border: 3px solid {{ringColor}}; box-shadow: 0 0 0 9999px rgba(8,12,20,0.35); pointer-events: none"></div>
<div style="position: absolute; left: 189px; top: 313px; width: 12px; height: 12px; border-radius: 6px; background: {{ringColor}}; pointer-events: none"></div>
<div style="position: absolute; top: 16px; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px">
<div style="flex: 1; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px; border-radius: 18px; background: rgba(11,18,32,0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(148,163,184,0.2)">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #1e293b; border: 1px solid rgba(148,163,184,0.3); display: flex; align-items: center; justify-content: center; font: 600 9px Inter, system-ui, sans-serif; color: #a5b4cb">[PHOTO]</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{heading}}</span><span style="font-size: 13px; color: #cbd5e1">{{sub}}</span></span>
</div>
<a href="Walk.dc.html" aria-label="Close camera" style="text-decoration: none; box-sizing: border-box; cursor: pointer; width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid rgba(148,163,184,0.2); background: rgba(11,18,32,0.55); color: #f1f5f9; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 96px; border-radius: 22px; background: rgba(11,18,32,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(148,163,184,0.16); padding: 12px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{confirm}}" style="width: 100%; height: 52px; border-radius: 26px; border: none; background: #2563eb; color: #ffffff; font: 600 16px Inter, system-ui, sans-serif">Done</button>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a href="Walk.dc.html" style="display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; cursor: pointer; width: 100%; height: 52px; border-radius: 26px; border: none; background: #16a34a; color: #ffffff; font: 600 16px Inter, system-ui, sans-serif">Direction set · Continue</a>
</sc-if>
<button type="button" style="width: 100%; height: 44px; border-radius: 22px; border: 1px solid rgba(148,163,184,0.3); background: transparent; color: #f1f5f9; font: 600 14px Inter, system-ui, sans-serif">Use another landmark</button>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 24px">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 30px; background: #f8fafc; box-shadow: 0 8px 24px rgba(0,0,0,0.45)">
<label for="ask10" style="position: absolute; left: -9999px">Ask the map</label>
<input id="ask10" type="text" placeholder="Can’t see it? Ask…" style="flex: 1; min-width: 0; height: 44px; padding-left: 12px; border: none; background: transparent; font: 400 16px Inter, system-ui, sans-serif; color: #0f172a; outline: none">
<button type="button" aria-label="Dictate" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: transparent; color: #475569; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button type="button" aria-label="Hands-free conversation" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; border: none; background: #2563eb; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: false }; }
  renderVals() {
    const done = this.state.done;
    return {
      done, notDone: !done,
      ringColor: done ? '#4ade80' : '#ffffff',
      heading: done ? 'Facing set' : 'Center [STORE] in the frame',
      sub: done ? 'The map now turns with you' : 'About 180 m ahead · then tap Done',
      confirm: () => this.setState({ done: true }),
      reset: () => this.setState({ done: false })
    };
  }
}
</script>
</body>
</html>
