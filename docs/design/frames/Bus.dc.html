<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Following your bus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9ec5ff}a:hover{color:#cfe2ff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0e1726; font-family: Inter, system-ui, sans-serif; color: #f1f5f9">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.85">
<g stroke="#1a2638" stroke-width="10" fill="none"><path d="M-20 120 L420 300"></path><path d="M-20 420 L420 520"></path><path d="M300 -20 L250 880"></path></g>
<path d="M20 600 C120 560 260 540 400 500" stroke="#a855f7" stroke-width="2" stroke-opacity="0.25" fill="none"></path>
<path d="M330 -20 C300 200 320 400 280 860" stroke="#22c55e" stroke-width="2" stroke-opacity="0.25" fill="none"></path>
<path d="M110 -20 C130 160 150 300 165 420" stroke="#0ea5e9" stroke-width="9" stroke-linecap="round" fill="none"></path>
<path d="M165 420 C180 500 200 560 215 640" stroke="#0ea5e9" stroke-width="9" stroke-linecap="round" stroke-dasharray="14 10" fill="none"></path>
<path d="M215 640 C230 720 240 790 250 860" stroke="#0ea5e9" stroke-width="9" stroke-linecap="round" fill="none"></path>
<circle cx="150" cy="330" r="9" fill="#0e1726" stroke="#ffffff" stroke-width="3"></circle>
<circle cx="165" cy="420" r="9" fill="#0e1726" stroke="#ffffff" stroke-width="3"></circle>
<circle cx="190" cy="530" r="9" fill="#0e1726" stroke="#ffffff" stroke-width="3"></circle>
<circle cx="215" cy="640" r="9" fill="#0e1726" stroke="#ffffff" stroke-width="3"></circle>
</svg>
<div style="position: absolute; right: 256px; top: 319px; padding: 2px 8px; border-radius: 6px; background: rgba(14,23,38,0.75); color: #e2e8f0; font: 600 12px Inter, system-ui, sans-serif; white-space: nowrap">23 St &amp; 8 Av</div><div style="position: absolute; right: 241px; top: 409px; padding: 2px 8px; border-radius: 6px; background: rgba(14,23,38,0.75); color: #e2e8f0; font: 600 12px Inter, system-ui, sans-serif; white-space: nowrap">23 St &amp; 7 Av</div><div style="position: absolute; right: 216px; top: 519px; padding: 2px 8px; border-radius: 6px; background: rgba(14,23,38,0.75); color: #e2e8f0; font: 600 12px Inter, system-ui, sans-serif; white-space: nowrap">23 St &amp; 6 Av</div><div style="position: absolute; right: 191px; top: 629px; padding: 2px 8px; border-radius: 6px; background: rgba(14,23,38,0.75); color: #e2e8f0; font: 600 12px Inter, system-ui, sans-serif; white-space: nowrap">23 St &amp; 5 Av</div><div role="img" aria-label="Your M23 bus" style="position: absolute; left: 139px; top: 359px; width: 38px; height: 38px; border-radius: 19px; box-shadow: 0 0 0 8px rgba(37,99,235,0.35), 0 2px 8px rgba(0,0,0,0.5); background: #0ea5e9; border: 3px solid #ffffff; color: #ffffff; display: flex; align-items: center; justify-content: center; font: 800 10px Inter, system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.5)">M23</div><div role="img" aria-label="A train between 34 St and 23 St &amp; 5 Av" style="position: absolute; left: 189px; top: 577px; width: 30px; height: 30px; border-radius: 15px; background: #0ea5e9; border: 3px solid #ffffff; color: #ffffff; display: flex; align-items: center; justify-content: center; font: 800 10px Inter, system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.5)">M23</div>
<sc-for list="{{marks}}" as="m" hint-placeholder-count="1">
<div style="position: absolute; left: {{m.left}}; top: {{m.top}}; width: 34px; height: 34px; border-radius: 17px; border: 3px solid {{m.color}}; box-shadow: 0 0 0 6px {{m.glow}}; pointer-events: none"></div>
<div style="position: absolute; left: {{m.labelLeft}}; top: {{m.labelTop}}; padding: 4px 8px; border-radius: 8px; background: {{m.color}}; color: #111827; font: 700 12px Inter, system-ui, sans-serif; white-space: nowrap">{{m.label}}</div>
</sc-for>
<div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 6px; border-radius: 22px; background: rgba(15,23,42,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(148,163,184,0.18)">
<span style="height: 32px; padding: 0 8px; border-radius: 10px; background: #0ea5e9; color: #ffffff; display: flex; align-items: center; justify-content: center; font: 800 13px Inter, system-ui, sans-serif">M23</span>
<span style="display: flex; flex-direction: column; padding-right: 8px"><span style="font-size: 14px; font-weight: 700">Following your M23</span><span style="font-size: 12px; color: #fcd34d">Crosstown · on time</span></span>
</div>
<a href="HomeDaily.dc.html" aria-label="Stop following" style="text-decoration: none; box-sizing: border-box; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(148,163,184,0.18); background: rgba(15,23,42,0.6); color: #f1f5f9; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 96px; border-radius: 22px; background: rgba(11,18,32,0.45); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(148,163,184,0.16); padding: 10px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 4px 4px 2px"><div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 17px; font-weight: 700">Next: 23 St &amp; 7 Av</span><span style="font-size: 15px; font-weight: 600; color: #fcd34d">3 min</span></div><div style="display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1"><span>23 St &amp; 6 Av</span><span>6 min</span></div><div style="display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1"><span>23 St &amp; 5 Av · your stop</span><span style="color: #f1f5f9; font-weight: 600">10 min</span></div></div><span style="padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #a5b4cb">Notices on the M23</span><div style="max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px">
<sc-for list="{{notices}}" as="n" hint-placeholder-count="3">
<button type="button" onClick="{{n.pick}}" aria-expanded="{{n.expanded}}" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid {{n.border}}; background: {{n.bg}}; color: #f1f5f9; text-align: left; font: 400 14px Inter, system-ui, sans-serif; cursor: pointer">
<span style="width: 10px; height: 10px; margin-top: 5px; border-radius: 5px; background: {{n.dot}}; flex-shrink: 0"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-weight: 600">{{n.title}}</span>
<span style="font-size: 13px; color: #cbd5e1">{{n.meta}}</span>
<sc-if value="{{n.selected}}" hint-placeholder-val="{{false}}">
<span style="margin-top: 4px; font-size: 13px; line-height: 1.45; color: #e2e8f0">{{n.body}}</span>
</sc-if>
</span>
<span aria-hidden="true" style="margin-top: 2px; color: #a5b4cb; transform: rotate({{n.chevron}})">⌄</span>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 44px; border-radius: 22px; border: none; background: #0ea5e9; color: #ffffff; font: 600 14px Inter, system-ui, sans-serif">Where to get off</button>
<button type="button" style="height: 44px; border-radius: 22px; border: 1px solid rgba(148,163,184,0.3); background: transparent; color: #f1f5f9; font: 600 14px Inter, system-ui, sans-serif">Other ways</button>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 24px">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 30px; background: #f8fafc; box-shadow: 0 8px 24px rgba(0,0,0,0.45)">
<label for="ask5" style="position: absolute; left: -9999px">Ask about this line</label>
<input id="ask5" type="text" placeholder="Ask about your bus…" style="flex: 1; min-width: 0; height: 44px; padding-left: 12px; border: none; background: transparent; font: 400 16px Inter, system-ui, sans-serif; color: #0f172a; outline: none">
<button type="button" aria-label="Dictate" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: transparent; color: #475569; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
<button type="button" aria-label="Hands-free conversation" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; border: none; background: #0ea5e9; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg></button>
</div>
</div>
<button type="button" aria-label="Center on my location" style="position: absolute; right: 16px; top: 72px; width: 44px; height: 44px; border-radius: 22px; border: 1px solid #263449; background: rgba(15,23,42,0.92); color: #60a5fa; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.5 2.9L13.4 21 21 3Z"></path></svg></button></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: -1 };
  }
  renderVals() {
    const data = [
      { title: 'Detour on 23 St', meta: 'Between 6 Av and 5 Av · until [TIME]', dot: '#f59e0b', color: '#f59e0b', glow: 'rgba(245,158,11,0.28)',
        body: 'Crosstown M23 buses detour via 22 St between 6 Av and 5 Av. The stop at 23 St & 6 Av moves to 22 St & 6 Av.',
        stations: [{ x: 190, y: 530, label: 'Stop moved' }] },
      { title: 'Stop closed: 23 St & 7 Av', meta: 'Construction · [DATES]', dot: '#94a3b8', color: '#cbd5e1', glow: 'rgba(203,213,225,0.22)',
        body: 'Use the stop at 23 St & 8 Av or 23 St & 6 Av instead.',
        stations: [{ x: 165, y: 420, label: 'Closed' }] }
    ];
    const picked = this.state.picked;
    const notices = data.map((n, i) => ({
      ...n,
      selected: i === picked,
      expanded: i === picked ? 'true' : 'false',
      chevron: i === picked ? '180deg' : '0deg',
      bg: i === picked ? 'rgba(37,99,235,0.22)' : 'rgba(15,23,42,0.35)',
      border: i === picked ? 'rgba(96,165,250,0.6)' : 'rgba(148,163,184,0.16)',
      pick: () => this.setState({ picked: i === this.state.picked ? -1 : i })
    }));
    const sel = data[picked];
    const marks = sel ? sel.stations.map((s) => ({
      left: (s.x - 17) + 'px', top: (s.y - 17) + 'px',
      labelLeft: (s.x + 22) + 'px', labelTop: (s.y - 12) + 'px',
      label: s.label, color: sel.color, glow: sel.glow
    })) : [];
    return { notices, marks, count: data.length };
  }
}
</script>
</body>
</html>
