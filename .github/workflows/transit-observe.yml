name: transit-observe
# Logs observed subway segment and dwell times into Octo every 15 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: transit-observe, cancel-in-progress: false }
jobs:
  observe:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 20
    container: { image: node:22-bookworm }
    env:
      OCTO_API_KEY: ${{ secrets.OCTO_API_KEY }}
      OCTO_WORKSPACE_ID: ${{ secrets.OCTO_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm transit:observe 13 30
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
