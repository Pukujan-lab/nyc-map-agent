name: Issue Triage

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    name: Validate ontology and classify issue log
    concurrency:
      group: oio-issue-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 10
    container: { image: "python:3.12-slim" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned OIO validator dependency
        run: |
          requirements="requirements.txt"
          if [ -f .oio/requirements.txt ]; then requirements=".oio/requirements.txt"; fi
          python -m pip install --no-cache-dir --requirement "$requirements"

      - name: Validate and label issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/oio_triage.py
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
