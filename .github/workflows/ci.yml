name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Module boundaries, orphans, cycles (dependency-cruiser)
        run: pnpm lint:boundaries
      - name: Dead code (knip)
        run: pnpm knip
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:size
      - name: Performance budget (size-limit, brotli per chunk)
        run: pnpm size
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Lockfile in sync
        run: pnpm install --frozen-lockfile
      - name: Audit (high+, baseline in pnpm-workspace.yaml)
        run: pnpm audit --audit-level high
      - name: Licence allowlist
        run: pnpm licenses:check
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ESLint (type-aware; baseline in eslint-suppressions.json)
        run: pnpm lint
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: openapi.json is up to date (every route has a spec)
        run: pnpm openapi:check
      - name: Breaking changes vs main (oasdiff)
        if: github.event_name == 'pull_request'
        run: |
          if ! git show origin/${{ github.base_ref }}:openapi.json > /tmp/base.json 2>/dev/null; then
            echo "no openapi.json on base yet; skipping"; exit 0
          fi
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.34.0/oasdiff_1.34.0_linux_amd64.tar.gz | tar xz -C /tmp oasdiff
          /tmp/oasdiff breaking /tmp/base.json openapi.json --fail-on ERR --format githubactions
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:e2e
      - name: Smoke e2e (Playwright, fixture API, offline)
        run: pnpm e2e
  deploy:
    needs: [check, size, deps, lint, api, e2e]
    # Rollout guard: Task 13 removes this line once the stack is bootstrapped.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - name: Trigger deploy
        id: trigger
        env:
          TOKEN: ${{ secrets.NYC_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${{ github.sha }}\"}" \
            https://nyc.design-bakery.com/deploy/api/deploy)
          id=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "started run $id"
      - name: Wait for the run
        env:
          TOKEN: ${{ secrets.NYC_DEPLOY_TOKEN }}
          RUN_ID: ${{ steps.trigger.outputs.id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            body=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
              "https://nyc.design-bakery.com/deploy/api/deploys/$RUN_ID" || true)
            status=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""))' 2>/dev/null || echo "")
            echo "run $RUN_ID: ${status:-pending}"
            case "$status" in
              succeeded|rolled-back) exit 0 ;;
              failed|interrupted)
                echo "deploy $status"
                curl -fsS -H "Authorization: Bearer $TOKEN" \
                  "https://nyc.design-bakery.com/deploy/api/deploys/$RUN_ID" | python3 -m json.tool
                exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out waiting for the deploy"; exit 1
