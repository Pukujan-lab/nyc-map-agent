name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 20
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Module boundaries, orphans, cycles (dependency-cruiser)
        run: pnpm lint:boundaries
      - name: Dead code (knip)
        run: pnpm knip
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  size:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 20
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:size
      - name: Performance budget (size-limit, brotli per chunk)
        run: pnpm size
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  deps:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 10
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - name: Lockfile in sync
        run: pnpm install --frozen-lockfile
      - name: Audit (high+, baseline in pnpm-workspace.yaml)
        run: pnpm audit --audit-level high
      - name: Licence allowlist
        run: pnpm licenses:check
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  lint:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 10
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ESLint (type-aware; baseline in eslint-suppressions.json)
        run: pnpm lint
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  api:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 10
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: openapi.json and its client types are up to date (every route has a spec)
        run: pnpm openapi:check
      - name: Breaking changes vs main need a major bump (oasdiff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tmp=$(mktemp -d)
          if ! git show "origin/$BASE_REF:openapi.json" > "$tmp/base.json" 2>/dev/null; then
            echo "no openapi.json on base yet; skipping"; exit 0
          fi
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.34.0/oasdiff_1.34.0_linux_amd64.tar.gz | tar xz -C "$tmp" oasdiff
          OASDIFF="$tmp/oasdiff" scripts/ci/api-breaking.sh "$tmp/base.json" openapi.json
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  migrations:
    # Round trip every migration (up, down to zero, up) on a throwaway Postgres
    # and fail on schema drift. See scripts/ci/migration-roundtrip.sh.
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 10
    container: { image: postgres:16.4-bookworm }
    services:
      pg:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_PASSWORD: ci-throwaway
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci-throwaway@pg:5432/postgres?sslmode=disable
      DBMATE_VERSION: 2.28.0
      DBMATE_SHA256: 4a3814fdb7253348d6b3cd60a2e315fba69e1a3a794a31ec75af2ca6019c835c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dbmate (pinned, checksum-verified)
        run: |
          apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
          curl -fsSL -o /usr/local/bin/dbmate "https://github.com/amacneil/dbmate/releases/download/v${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  /usr/local/bin/dbmate" | sha256sum -c -
          chmod +x /usr/local/bin/dbmate
      - name: Migrations up / down / up, fail on drift
        run: OUT_DIR=$RUNNER_TEMP scripts/ci/migration-roundtrip.sh
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  pr-title:
    # Squash merges make the PR title the commit on main, and release-please
    # reads those commits; so the title must be a Conventional Commit.
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 10
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: PR title is a Conventional Commit (commitlint)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm -s lint:commit
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  e2e:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 20
    container: { image: mcr.microsoft.com/playwright:v1.56.1-noble }
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Browsers come from the image (version-matched to @playwright/test 1.56.1); no install step.
      - run: pnpm build:e2e
      - name: Smoke e2e (Playwright, fixture API, offline)
        run: pnpm e2e
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  deploy:
    needs: [check, size, deps, lint, api, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 30
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    container: { image: node:22-bookworm }
    # The container defaults run steps to sh; the deploy scripts use pipefail.
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Apply pending prod migrations before the new code goes live, so a deploy
      # never waits for the nightly ingest to create the schema it needs.
      - name: Migrate prod DB
        env:
          OCTO_API_KEY: ${{ secrets.OCTO_API_KEY }}
          OCTO_WORKSPACE_ID: ${{ secrets.OCTO_WORKSPACE_ID }}
        run: pnpm db:migrate
      - name: Trigger deploy
        id: trigger
        env:
          TOKEN: ${{ secrets.NYC_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"${{ github.sha }}\"}" \
            https://nyc.design-bakery.com/deploy/api/deploy)
          id=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "started run $id"
      - name: Wait for the run
        env:
          TOKEN: ${{ secrets.NYC_DEPLOY_TOKEN }}
          RUN_ID: ${{ steps.trigger.outputs.id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            body=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
              "https://nyc.design-bakery.com/deploy/api/deploys/$RUN_ID" || true)
            status=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""))' 2>/dev/null || echo "")
            echo "run $RUN_ID: ${status:-pending}"
            case "$status" in
              succeeded|rolled-back) exit 0 ;;
              failed|interrupted)
                echo "deploy $status"
                curl -fsS -H "Authorization: Bearer $TOKEN" \
                  "https://nyc.design-bakery.com/deploy/api/deploys/$RUN_ID" | python3 -m json.tool
                exit 1 ;;
            esac
            sleep 10
          done
          echo "timed out waiting for the deploy"; exit 1
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  contract:
    # The freshly deployed server against the openapi.json it was built from:
    # every read-only /api/v1 route, a couple of generated requests each,
    # checked for server errors, response shape and content type (#205).
    # POST routes (agent, speech) are left out because each call costs money.
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 15
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: curl -LsSf https://releases.astral.sh/github/uv/releases/download/0.12.22/uv-installer.sh | env UV_INSTALL_DIR="$RUNNER_TEMP/uv" UV_NO_MODIFY_PATH=1 sh
      - name: Schemathesis against nyc.design-bakery.com
        run: >
          "$RUNNER_TEMP/uv/uvx" schemathesis@4.0.0 run openapi.json
          --url https://nyc.design-bakery.com
          --exclude-method POST --exclude-path-regex '^/api/(?!v1/)'
          --max-examples 2 --phases examples,fuzzing
          --checks not_a_server_error,response_schema_conformance,content_type_conformance
          --rate-limit 3/s --request-timeout 20
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
