name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: 
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 20
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Module boundaries, orphans, cycles (dependency-cruiser)
        run: pnpm lint:boundaries
      - name: Dead code (knip)
        run: pnpm knip
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  size:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 20
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:size
      - name: Performance budget (size-limit, brotli per chunk)
        run: pnpm size
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  deps:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 10
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - name: Lockfile in sync
        run: pnpm install --frozen-lockfile
      - name: Audit (high+, baseline in pnpm-workspace.yaml)
        run: pnpm audit --audit-level high
      - name: Licence allowlist
        run: pnpm licenses:check
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  lint:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 10
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: ESLint (type-aware; baseline in eslint-suppressions.json)
        run: pnpm lint
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  api:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 10
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: openapi.json and the generated client types are up to date
        run: pnpm openapi:check
      - name: Breaking changes vs main need a major bump (oasdiff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tmp=$(mktemp -d)
          if ! git show "origin/$BASE_REF:openapi.json" > "$tmp/base.json" 2>/dev/null; then
            echo "no openapi.json on base yet; skipping"; exit 0
          fi
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.34.0/oasdiff_1.34.0_linux_amd64.tar.gz | tar xz -C "$tmp" oasdiff
          OASDIFF="$tmp/oasdiff" scripts/ci/api-breaking.sh "$tmp/base.json" openapi.json
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  contract:
    # Real server vs openapi.json (schemathesis). See scripts/ci/contract.sh.
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 15
    container: { image: node:22-bookworm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install schemathesis (pinned)
        run: |
          apt-get update -qq && apt-get install -y -qq python3-venv >/dev/null
          python3 -m venv "$RUNNER_TEMP/st"
          "$RUNNER_TEMP/st/bin/pip" install -q -r scripts/ci/contract-requirements.txt
      - name: Contract test against the real server (schemathesis)
        run: SCHEMATHESIS="$RUNNER_TEMP/st/bin/schemathesis" scripts/ci/contract.sh
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
  e2e:
    runs-on: [self-hosted, linux, x64, gravebuster]
    timeout-minutes: 20
    container: { image: mcr.microsoft.com/playwright:v1.56.1-noble }
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Browsers come from the image (version-matched to @playwright/test 1.56.1); no install step.
      - run: pnpm build:e2e
      - name: Smoke e2e (Playwright, fixture API, offline)
        run: pnpm e2e
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
