name: nightly-ingest
on:
  schedule:
    - cron: "30 7 * * *" # 03:30 New York (EDT)
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated registry ids (blank = all)"
        required: false
        default: ""
permissions:
  contents: read
concurrency: { group: ingest, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: { image: node:22-bookworm }
    env:
      OCTO_API_KEY: ${{ secrets.OCTO_API_KEY }}
      OCTO_WORKSPACE_ID: ${{ secrets.OCTO_WORKSPACE_ID }}
      SOCRATA_KEY_ID: ${{ secrets.SOCRATA_KEY_ID }}
      SOCRATA_KEY_SECRET: ${{ secrets.SOCRATA_KEY_SECRET }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # Input passed via env, not interpolated into the script (injection-safe).
      - run: |
          # shellcheck disable=SC2086 # space-separated ids are meant to split
          pnpm exec tsx scripts/ingest.ts $SOURCES
        env:
          SOURCES: ${{ github.event.inputs.sources }}
      - if: always()
        run: pnpm db:refresh
      # Boundaries change rarely; reloading is cheap and keeps /api/areas current.
      - if: always()
        run: pnpm load:areas
      # Precomputed browser rollups for /api/aggregate (octo backend).
      - if: always()
        run: pnpm build:aggregates
      - name: Clean workspace (persistent runner)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true
